<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character and word counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Simple word counter Program</h2>
    <div class="container">
        <textarea name="" id="textBox" placeholder="Type your text here....."></textarea>
        <br>
        <br>
        <button type="submit" id="countLength">Count Length</button>
        <button type="submit" id="Trim">Trim</button>
        <button type="submit" id="ToUpperCase">To UpperCase</button>
        <button type="submit" id="ToLowerCase">To LowerCase</button>
        <button type="submit" id="CountWord">Count Word</button>
    </div>
    <div class="output-box" id="outputBox" placeholder="Output will appear here.....">
        
    </div>



    <script src="script.js"></script>
</body>
</html>
